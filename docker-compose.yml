services:
  migrate:
    container_name: zun-cms-migrate-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        DATABASE_URI: ${DATABASE_URI}
    env_file: .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot service for importing initial content. Not started by
  # `docker compose up` (gated by `profiles: [seed]`); invoke explicitly:
  #   docker compose --profile seed run --rm seed
  # Mounts the same media_uploads volume as the app so uploaded files
  # land where the app will serve them from.
  seed:
    container_name: zun-cms-seed-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: seeder
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        DATABASE_URI: ${DATABASE_URI}
    env_file: .env
    networks:
      - internal
    volumes:
      - media_uploads:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - seed
    restart: "no"

  app:
    container_name: zun-cms-app-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAYLOAD_SECRET: ${PAYLOAD_SECRET}
        DATABASE_URI: ${DATABASE_URI}
    networks:
      - hosting
      - internal
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_uploads:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      - "traefik.http.routers.zun-cms-app-prod.rule=Host(`admin-cms.zunkireelabs.com`)"
      - "traefik.http.routers.zun-cms-app-prod.entrypoints=websecure"
      - "traefik.http.routers.zun-cms-app-prod.tls=true"
      - "traefik.http.routers.zun-cms-app-prod.tls.certresolver=letsencrypt"
      - "traefik.http.routers.zun-cms-app-prod-http.rule=Host(`admin-cms.zunkireelabs.com`)"
      - "traefik.http.routers.zun-cms-app-prod-http.entrypoints=web"
      - "traefik.http.routers.zun-cms-app-prod-http.middlewares=zun-cms-app-prod-redirect"
      - "traefik.http.middlewares.zun-cms-app-prod-redirect.redirectscheme.scheme=https"
      - "traefik.http.services.zun-cms-app-prod.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16-alpine
    container_name: zun-cms-postgres-prod
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_DB: zun_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_uploads:

networks:
  hosting:
    external: true
  internal:
    driver: bridge
