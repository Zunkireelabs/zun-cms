version: '3.8'

services:
  app:
    build: .
    container_name: zun-cms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/zun_cms
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
      - REVALIDATE_URL=${REVALIDATE_URL:-}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-}
    volumes:
      - media_uploads:/app/public/media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: zun-cms-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=zun_cms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_uploads:
