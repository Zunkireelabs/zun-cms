name: Deploy to Staging

on:
  push:
    branches: [stage]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/zun_cms
          PAYLOAD_SECRET: ci-build-secret-not-real
          NEXT_PUBLIC_SERVER_URL: https://dev-admin-cms.zunkireelabs.com

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            REPO="${{ github.event.repository.name }}"
            DIR="/home/zunkireelabs/devprojects/${REPO}-app-stage"

            if [ ! -d "$DIR" ]; then
              echo "First deployment — bootstrapping $DIR"
              mkdir -p "$DIR"
              git clone -b stage git@github.com:${{ github.repository }}.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin --prune
            git checkout -B stage origin/stage

            cat > .env << 'ENVEOF'
            DATABASE_URI=postgresql://postgres:${{ secrets.STAGING_POSTGRES_PASSWORD }}@postgres:5432/zun_cms
            POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
            PAYLOAD_SECRET=${{ secrets.STAGING_PAYLOAD_SECRET }}
            NEXT_PUBLIC_SERVER_URL=https://dev-admin-cms.zunkireelabs.com
            REVALIDATE_URL=${{ secrets.STAGING_REVALIDATE_URL }}
            REVALIDATE_SECRET=${{ secrets.STAGING_REVALIDATE_SECRET }}
            ENVEOF

            docker compose -f docker-compose.dev.yml up -d --build

            echo "Waiting for container to be healthy..."
            sleep 30
            CONTAINER="${REPO}-app-stage"
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs "$CONTAINER" --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.STAGING_DOMAIN }}")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Staging health check passed (HTTP $HTTP_CODE)"
          else
            echo "Staging health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
