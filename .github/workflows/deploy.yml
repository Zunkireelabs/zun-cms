name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runner image (target=runner)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/zunkireelabs/zun-cms:main
          cache-from: type=gha,scope=zun-cms-main
          cache-to: type=gha,mode=max,scope=zun-cms-main

      - name: Build & push tools image (target=tools)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: true
          tags: ghcr.io/zunkireelabs/zun-cms:tools
          cache-from: type=gha,scope=zun-cms-main
          cache-to: type=gha,mode=max,scope=zun-cms-main

  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production
    timeout-minutes: 10
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            REPO="${{ github.event.repository.name }}"
            DIR="/root/devprojects/${REPO}-app-prod"

            if [ ! -d "$DIR" ]; then
              echo "==> First deployment — bootstrapping $DIR"
              mkdir -p "$DIR"
              git clone -b main git@github.com:${{ github.repository }}.git "$DIR"
            fi

            cd "$DIR"
            git fetch origin --prune
            git reset --hard HEAD
            git checkout -B main origin/main

            cat > .env << 'ENVEOF'
            DATABASE_URI=postgresql://postgres:${{ secrets.PROD_POSTGRES_PASSWORD }}@postgres:5432/zun_cms
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            PAYLOAD_SECRET=${{ secrets.PROD_PAYLOAD_SECRET }}
            NEXT_PUBLIC_SERVER_URL=https://admin-cms.zunkireelabs.com
            REVALIDATE_URL=${{ secrets.PROD_REVALIDATE_URL }}
            REVALIDATE_SECRET=${{ secrets.PROD_REVALIDATE_SECRET }}
            ENVEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d

            echo "Waiting for app container to be healthy..."
            sleep 20
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' zun-cms-app-prod 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/18: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 3 minutes"
            docker logs zun-cms-app-prod --tail 80
            exit 1

  health-check:
    name: Health check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify production URL
        run: |
          echo "Waiting 10s for any warmup..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://admin-cms.zunkireelabs.com/admin")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Production health check passed"
          else
            echo "::error::Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
