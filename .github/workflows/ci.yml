name: CI

on:
  pull_request:
    branches: [main, stage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/zun_cms
          PAYLOAD_SECRET: ci-build-secret-not-real
          NEXT_PUBLIC_SERVER_URL: https://admin-cms.zunkireelabs.com
