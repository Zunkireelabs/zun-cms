version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zun-cms-dev-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=zun_cms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
